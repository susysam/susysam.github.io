<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/site-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Google_Classroom_Logo.svg/2372px-Google_Classroom_Logo.svg.png" type="image/png">

  <script>
    (function () {
      const theme = siteStorage.getItem('theme');
      if (theme === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })();
  </script>

  <style>
    :root{
      --bg: #f5f5f5;
      --text: #222;
      --muted: rgba(0,0,0,0.65);

      --accent: #6C0BA9;
      --accent2: #4F0672;

      --card: rgba(255, 255, 255, 0.75);
      --border: rgba(0,0,0,0.10);
      --shadow: 0 18px 45px rgba(0,0,0,0.18);

      --overlay: rgba(255,255,255,0);
      --inputBg: rgba(255,255,255,.78);
    }

    :root.dark{
      --bg: #0f1116;
      --text: #f2f4f8;
      --muted: rgba(242,244,248,0.68);

      --card: rgba(25,28,36,.72);
      --border: rgba(255,255,255,0.12);
      --shadow: 0 18px 55px rgba(0,0,0,0.55);

      --overlay: rgba(0,0,0,0.45);
      --inputBg: rgba(0,0,0,.25);
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;

      background-size: cover;
      background-position: center;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
    }

    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background: var(--overlay);
      pointer-events:none;
      z-index: 0;
    }
    body > *{
      position: relative;
      z-index: 1;
    }

    .navbar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: calc(100vw - 40px);
    }

    .navbar a {
      padding: 10px 20px;
      font-size: 16px;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
      cursor: pointer;
      user-select: none;
    }
    .navbar a:hover { background-color: var(--accent2); }

    #placeholder {
      font-size: 20px;
      margin-top: 20px;
      font-weight: 500;
      color: var(--text);
    }

    .time-window {
      margin-top: 18px;
      width: min(560px, calc(100vw - 40px));
      border-radius: 14px;
      overflow: hidden;

      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .time-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;

      background: rgba(108, 11, 169, 0.10);
      border-bottom: 1px solid var(--border);
    }

    .time-titlebar .left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .window-dots { display: flex; gap: 7px; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(0,0,0,0.18);
    }
    :root.dark .dot{ background: rgba(255,255,255,0.18); }

    .time-title {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tz-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(108, 11, 169, 0.12);
      color: var(--accent2);
      border: 1px solid rgba(108, 11, 169, 0.22);
    }

    .time-body { padding: 18px 16px 20px; }

    #time {
      font-size: 34px;
      font-weight: 800;
      margin: 0;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    #time-sub {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .button-container { margin-top: 24px; }

    .button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .button:hover { background-color: var(--accent2); }

  </style>
  <script src="/site-appearance.js"></script>
  <link rel="stylesheet" href="/site-navigation.css">
  <link rel="stylesheet" href="/account-ui.css">
  <script type="module" src="/firebase-config.js"></script>
  <script type="module" src="/account-ui.js"></script>
  <script type="module" src="/site-clock.js"></script>
</head>

<body data-home-background class="home-page">
  <nav class="navbar" aria-label="Main navigation">
    <a href="games.html">Games</a>
    <a href="tabs.html">Tabs</a>
    <a href="settings.html">Settings</a>
    <a href="movie+tv.html">Movie + TV</a>
    <button type="button" data-account-logout data-auth-only hidden>Log out</button>
    <a class="account-entry-button" href="/index.html" data-login-link>Log in</a>
  </nav>
  <p data-logout-feedback role="alert"></p>
  <main class="home-content">

  <p id="placeholder"></p>

  <div class="time-window" role="group" aria-label="Current time">
    <div class="time-titlebar"><h1 class="time-title">Current Time</h1></div>
    <div class="time-body">
      <p id="time">--:--:--</p>
      <div id="time-sub"></div>
    </div>
  </div>

  </main>
  <footer class="page-sync-footer"><p data-cloud-indicator role="status">Checking cloud saving…</p></footer>

  <script>
    const options = [
      "We got leo making websites before gta 6",
      "Welcome to home."
    ];
    function getRandomOption() {
      return options[Math.floor(Math.random() * options.length)];
    }
    document.getElementById("placeholder").textContent = getRandomOption();

    // The shared clock module uses IANA timezone rules from Intl.


  </script>
</body>
</html>
