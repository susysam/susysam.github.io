<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/site-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Google_Classroom_Logo.svg/2372px-Google_Classroom_Logo.svg.png" type="image/png">

  <script>
    (function () {
      try {
        const theme = window.siteStorage ? siteStorage.getItem('theme') : localStorage.getItem('theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch {}
    })();
  </script>

  <script src="/site-appearance.js"></script>
  <link rel="stylesheet" href="/site-navigation.css">
  <link rel="stylesheet" href="/account-ui.css">
  <script type="module" src="/firebase-config.js"></script>
  <script type="module" src="/account-ui.js"></script>
  <script type="module" src="/site-clock.js"></script>

  <!-- Placed after external CSS so icon styles are never overridden -->
  <style>
    :root{
      --bg: #f5f5f5;
      --text: #222;
      --muted: rgba(0,0,0,0.65);

      --accent: #6C0BA9;
      --accent2: #4F0672;

      --card: rgba(255, 255, 255, 0.75);
      --border: rgba(0,0,0,0.10);
      --shadow: 0 18px 45px rgba(0,0,0,0.18);

      --overlay: rgba(255,255,255,0);
      --inputBg: rgba(255,255,255,.78);
    }

    :root.dark{
      --bg: #0f1116;
      --text: #f2f4f8;
      --muted: rgba(242,244,248,0.68);

      --card: rgba(25,28,36,.72);
      --border: rgba(255,255,255,0.12);
      --shadow: 0 18px 55px rgba(0,0,0,0.55);

      --overlay: rgba(0,0,0,0.45);
      --inputBg: rgba(0,0,0,.25);
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;

      background-size: cover;
      background-position: center;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
    }

    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background: var(--overlay);
      pointer-events:none;
      z-index: 0;
    }
    body > *{
      position: relative;
      z-index: 1;
    }

    .navbar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: calc(100vw - 40px);
    }

    .navbar a.nav-feature-link {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 700;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .navbar a.nav-feature-link:hover {
      background-color: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(108, 11, 169, 0.35);
    }

    /* ── Icon Mode (On = Images, Off = Words) ── */
    .navbar.icons-on a.nav-feature-link {
      padding: 0 !important;
      width: 60px !important;
      height: 60px !important;
      min-width: 60px !important;
      border-radius: 12px !important;
      overflow: hidden;
      background: transparent !important;
    }

    .navbar.icons-on a.nav-feature-link:hover {
      box-shadow: none;
    }

    .nav-link-icon {
      width: 60px;
      height: 60px;
      object-fit: contain;
      display: none !important;
      pointer-events: none;
    }

    .navbar.icons-on .nav-link-icon {
      display: block !important;
    }

    .navbar.icons-on .nav-link-text {
      display: none !important;
    }

    .navbar:not(.icons-on) .nav-link-icon {
      display: none !important;
    }

    .navbar:not(.icons-on) .nav-link-text {
      display: inline !important;
    }

    #placeholder {
      font-size: 20px;
      margin-top: 20px;
      font-weight: 500;
      color: var(--text);
    }

    .time-window {
      margin-top: 18px;
      width: min(560px, calc(100vw - 40px));
      border-radius: 14px;
      overflow: hidden;

      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .time-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;

      background: rgba(108, 11, 169, 0.10);
      border-bottom: 1px solid var(--border);
    }

    .time-title {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .time-body { padding: 18px 16px 20px; }

    #time {
      font-size: 34px;
      font-weight: 800;
      margin: 0;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    #time-sub {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .page-sync-footer {
      cursor: pointer;
    }
  </style>
</head>

<body data-home-background class="home-page">
  <nav class="navbar icons-on" id="mainNavbar" aria-label="Main navigation">
    <a href="games.html" class="nav-feature-link" title="Games + Apps" aria-label="Games + Apps">
      <img
        class="nav-link-icon"
        src="/images/games.png"
        data-alt-src="images/games.png"
        data-fallback-type="games"
        alt="Games + Apps"
        onerror="handleNavIconError(this)"
      >
      <span class="nav-link-text">Games + Apps</span>
    </a>
    <a href="tabs.html" class="nav-feature-link" title="Tabs" aria-label="Tabs">
      <img
        class="nav-link-icon"
        src="/images/tab.png"
        data-alt-src="images/tab.png"
        data-fallback-type="tabs"
        alt="Tabs"
        onerror="handleNavIconError(this)"
      >
      <span class="nav-link-text">Tabs</span>
    </a>
    <a href="movie+tv.html" class="nav-feature-link" title="Movie + TV" aria-label="Movie + TV">
      <img
        class="nav-link-icon"
        src="/images/movies.png"
        data-alt-src="images/movies.png"
        data-fallback-type="movies"
        alt="Movie + TV"
        onerror="handleNavIconError(this)"
      >
      <span class="nav-link-text">Movie + TV</span>
    </a>
    <a href="/settings.html" class="site-settings-gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 2h4l.5 2.2c.6.2 1.2.4 1.7.7l1.9-1.2 2.8 2.8-1.2 1.9c.3.5.5 1.1.7 1.7L22 10v4l-2.2.5c-.2.6-.4 1.2-.7 1.7l1.2 1.9-2.8 2.8-1.9-1.2c-.5.3-1.1.5-1.7.7L14 22h-4l-.5-2.2c-.6-.2-1.2-.4-1.7-.7l-1.9 1.2-2.8-2.8 1.2-1.9c-.3-.5-.5-1.1-.7-1.7L2 14v-4l2.2-.5c.2-.6.4-1.2.7-1.7L3.7 5.9l2.8-2.8 1.9 1.2c.5-.3 1.1-.5 1.7-.7L10 2Z"/><circle cx="12" cy="12" r="3"/></svg></a>
    <button type="button" data-account-logout data-auth-only hidden>Log out</button>
    <a class="account-entry-button" href="/index.html" data-login-link>Log in</a>
  </nav>

  <p data-logout-feedback role="alert"></p>

  <main class="home-content">
    <p id="placeholder"></p>

    <div class="time-window" role="group" aria-label="Current time">
      <div class="time-titlebar"><h1 class="time-title">Current Time</h1></div>
      <div class="time-body">
        <p id="time">--:--:--</p>
        <div id="time-sub"></div>
      </div>
    </div>
  </main>

  <footer class="page-sync-footer" id="syncFooter">
    <p data-cloud-indicator role="status">Checking cloud saving…</p>
  </footer>

  <!-- Account controls stay available to the shared account UI. -->
  <div data-account-panel="manage" id="hiddenAccountPanel" hidden style="display:none !important;"></div>

  <script>
    const FALLBACK_NAV_SVGS = {
      games: "data:image/svg+xml;utf8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4m-2-2v4"/><circle cx="15" cy="11" r="1" fill="#ffffff"/><circle cx="17" cy="13" r="1" fill="#ffffff"/></svg>'
      ),
      tabs: "data:image/svg+xml;utf8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5"/></svg>'
      ),
      movies: "data:image/svg+xml;utf8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20M7 4l3 4M14 4l3 4"/><polygon points="10 11 16 14 10 17 10 11" fill="#ffffff" stroke="none"/></svg>'
      )
    };

    function handleNavIconError(img) {
      if (!img.dataset.triedAlt && img.dataset.altSrc) {
        img.dataset.triedAlt = "true";
        img.src = img.dataset.altSrc;
        return;
      }
      const fallbackType = img.dataset.fallbackType;
      if (fallbackType && FALLBACK_NAV_SVGS[fallbackType] && img.src !== FALLBACK_NAV_SVGS[fallbackType]) {
        img.src = FALLBACK_NAV_SVGS[fallbackType];
      }
    }

    const options = [
      "We got leo making websites before gta 6",
      "Welcome to home."
    ];
    function getRandomOption() {
      return options[Math.floor(Math.random() * options.length)];
    }
    document.getElementById("placeholder").textContent = getRandomOption();

    function getSetting(key, fallback) {
      try {
        const val = window.siteStorage ? siteStorage.getItem(key) : localStorage.getItem(key);
        return val !== null && val !== undefined && val !== "" ? val : fallback;
      } catch {
        return fallback;
      }
    }

    // Navigation Icons setting: On ("on" or default) = Images, Off ("off") = Words
    function applyNavIconsPreference() {
      const nav = document.getElementById("mainNavbar");
      if (!nav) return;
      const mode = getSetting("navIcons", "on");
      nav.classList.toggle("icons-on", mode !== "off");
    }

    applyNavIconsPreference();

    window.addEventListener("storage", (e) => {
      if (e.key === null || e.key === "navIcons") {
        applyNavIconsPreference();
      }
    });

  </script>
</body>
</html>
