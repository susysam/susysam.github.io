<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/site-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Screen</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Google_Classroom_Logo.svg/2372px-Google_Classroom_Logo.svg.png" type="image/png" />

  <script>
    (function () {
      const theme = siteStorage.getItem('theme');
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>

  <style>
    :root {
      --bg: #f4f7fc;
      --text: #14161a;
      --muted: rgba(20, 22, 26, .65);
      --border: rgba(0, 0, 0, .14);
      --card: rgba(255, 255, 255, .82);
      --card-inner: rgba(255, 255, 255, .65);
      --overlay: rgba(255, 255, 255, 0);
      --accent: #6c0ba9;
      --accent-hover: #4f0672;
      --normal: #2563eb;
      --normal-hover: #1d4ed8;
      --blank: #059669;
      --blank-hover: #047857;
      --secret: #d97706;
      --secret-hover: #b45309;
      --preview: #7c3aed;
      --preview-hover: #6d28d9;
      --danger: #ff5733;
      --danger-hover: #e04522;
      --success: #059669;
      --laptop-shell: #dcdde1;
      --laptop-bezel: #1e272e;
    }

    :root.dark {
      --bg: #0f1116;
      --text: #f2f4f8;
      --muted: rgba(242, 244, 248, .68);
      --border: rgba(255, 255, 255, .14);
      --card: rgba(25, 28, 36, .78);
      --card-inner: rgba(18, 20, 26, .55);
      --overlay: rgba(0, 0, 0, .45);
      --laptop-shell: #2f3640;
      --laptop-bezel: #0f1418;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: background-color .25s ease, color .25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--overlay);
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(20px);
      animation: ui-reveal .65s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    @keyframes ui-reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .home-button,
    .action-button,
    .error-action-btn {
      border: 0;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .2s ease, transform .1s ease, box-shadow .2s ease;
      text-decoration: none;
    }

    .home-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 22px;
      border-radius: 10px;
      background: var(--accent);
      font-size: 15px;
    }

    .home-button:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px rgba(108, 11, 169, .35);
    }

    .home-button:active,
    .action-button:active,
    .error-action-btn:active {
      transform: translateY(1px);
    }

    .search-bar {
      width: 100%;
      max-width: 580px;
      margin-bottom: 14px;
      padding: 13px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .04);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 11, 169, .18);
    }

    .action-buttons {
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .action-button {
      min-height: 42px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
    }

    .action-button.normal {
      background: var(--normal);
    }
    .action-button.normal:hover {
      background: var(--normal-hover);
    }

    .action-button.blank {
      background: var(--blank);
    }
    .action-button.blank:hover {
      background: var(--blank-hover);
    }

    .action-button.secret {
      background: var(--secret);
    }
    .action-button.secret:hover {
      background: var(--secret-hover);
    }

    .action-button.preview {
      min-height: 38px;
      align-self: center;
      padding: 9px 16px;
      background: var(--preview);
      font-size: 13px;
    }
    .action-button.preview:hover {
      background: var(--preview-hover);
    }

    .status-message {
      min-height: 20px;
      margin: -10px 0 16px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    /* ─── SAVED / RECOMMENDED LINKS SECTION ─── */
    .saved-links-section {
      width: 100%;
      max-width: 580px;
      margin-bottom: 25px;
      padding: 20px 22px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .saved-links-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .saved-links-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: .2px;
    }

    .saved-links-count {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 20px;
      background: rgba(108, 11, 169, 0.12);
      color: var(--accent);
      border: 1px solid rgba(108, 11, 169, 0.25);
    }
    :root.dark .saved-links-count {
      background: rgba(198, 160, 246, 0.16);
      color: #d1b3ff;
      border-color: rgba(198, 160, 246, 0.35);
    }

    .saved-links-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .saved-form-inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .saved-input {
      flex: 1;
      min-width: 170px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--card-inner);
      color: var(--text);
      font-size: 14px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .saved-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(108, 11, 169, .15);
    }

    .saved-form-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .saved-save-btn {
      padding: 10px 22px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: background-color .2s ease, transform .1s ease, opacity .2s ease;
      white-space: nowrap;
    }
    .saved-save-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .saved-save-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .saved-save-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .saved-links-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .saved-link-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      animation: fadeInRow .22s ease-out;
    }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .saved-link-card {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-inner);
      color: var(--text);
      cursor: pointer;
      transition: border-color .2s ease, background-color .2s ease, transform .1s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      outline: none;
    }
    .saved-link-card:hover {
      border-color: var(--accent);
      background: rgba(108, 11, 169, 0.08);
    }
    .saved-link-card:active {
      transform: translateY(1px);
    }

    .saved-link-card strong {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .saved-link-card small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .saved-link-action-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-inner);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      transition: all .2s ease;
      outline: none;
      user-select: none;
    }

    .saved-copy-btn {
      color: var(--text);
      min-width: 74px;
      padding: 0 10px;
      gap: 5px;
    }
    .saved-copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(108, 11, 169, 0.08);
    }
    .saved-copy-btn.copied {
      border-color: var(--success);
      color: var(--success);
      background: rgba(5, 150, 105, 0.12);
    }

    .saved-delete-btn {
      width: 42px;
      color: var(--danger);
      font-size: 17px;
      font-weight: 800;
    }
    .saved-delete-btn:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .saved-delete-btn:active {
      transform: scale(.95);
    }

    .saved-empty-hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      line-height: 1.4;
    }

    .saved-status-msg {
      font-size: 12px;
      min-height: 16px;
      font-weight: 700;
      color: var(--danger);
    }

    /* ─── LAPTOP HARDWARE PREVIEW ─── */
    .laptop-hardware {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(.96);
      transition: opacity .4s ease, transform .4s ease;
    }

    .laptop-hardware.visible {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .preview-fallback { margin-top: 18px; color: var(--muted); font-size: 14px; text-align: center; }
    .preview-fallback a { color: var(--accent); font-weight: 700; }

    .laptop-screen-frame {
      width: 100%;
      aspect-ratio: 16 / 10;
      padding: 20px 20px 24px;
      position: relative;
      border-radius: 16px 16px 0 0;
      background: var(--laptop-bezel);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
    }

    .laptop-display-content {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      border-radius: 4px;
      background: #111;
    }

    .virtual-iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #fff;
    }

    .loader-screen-overlay,
    .error-screen-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .loader-screen-overlay {
      z-index: 5;
      background: #141519;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, .1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-screen-overlay {
      z-index: 10;
      flex-direction: column;
      padding: 20px;
      background: #1e222b;
      color: #fff;
      text-align: center;
    }

    .error-card {
      max-width: 420px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
    }

    .error-title {
      margin-bottom: 10px;
      color: #ff6b6b;
      font-size: 20px;
      font-weight: 700;
    }

    .error-copy {
      margin-bottom: 16px;
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      line-height: 1.45;
    }

    .error-action-btn {
      padding: 10px 20px;
      border-radius: 6px;
      background: #ff5252;
      font-size: 14px;
    }

    .error-action-btn:hover {
      background: #ff3333;
    }
    .retry-btn { margin-left: 8px; background: #475569; }
    .retry-btn:hover { background: #334155; }

    .laptop-base-chassis {
      width: 104%;
      height: 14px;
      position: relative;
      border-top: 2px solid rgba(255, 255, 255, .2);
      border-radius: 0 0 16px 16px;
      background: var(--laptop-shell);
      box-shadow: 0 12px 25px rgba(0, 0, 0, .2);
    }

    .laptop-base-chassis::before {
      content: "";
      width: 70px;
      height: 4px;
      position: absolute;
      top: 0;
      left: 50%;
      border-radius: 0 0 4px 4px;
      background: rgba(0, 0, 0, .15);
      transform: translateX(-50%);
    }

    @media (max-width: 650px) {
      .action-buttons {
        flex-direction: column;
      }

      .action-button {
        width: 100%;
      }

      .laptop-screen-frame {
        padding: 10px 10px 14px;
        border-radius: 10px 10px 0 0;
      }

      .saved-form-inputs {
        flex-direction: column;
      }
      .saved-input {
        width: 100%;
      }
    }
  </style>
  <script src="/site-appearance.js"></script>
  <script src="/direct-link-timer.js"></script>
  <link rel="stylesheet" href="/site-navigation.css">
  <link rel="stylesheet" href="/account-ui.css">
  <script type="module" src="/firebase-config.js"></script>
  <script type="module" src="/account-ui.js"></script>
</head>
<body>
  <main class="app-container">
    <nav class="site-home-nav" aria-label="Main navigation">
      <a class="site-home-button" href="/start27.html">← Home</a>
    </nav>

    <label for="searchInput" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Website URL</label>
    <input
      type="url"
      id="searchInput"
      class="search-bar"
      placeholder="Enter web URL (e.g., example.com)"
      autocomplete="url"
      onkeydown="if (event.key === 'Enter') openInputNormally()"
    />

    <div class="action-buttons" aria-label="Site opening options">
      <button class="action-button normal" type="button" onclick="openInputNormally()">Open Site (Normally)</button>
      <button class="action-button blank" type="button" onclick="openInputInAboutBlank()">Open Site (About:Blank)</button>
      <button class="action-button secret" type="button" onclick="openSecretMovieLink()">Secret Movie Link</button>
      <button class="action-button preview" type="button" onclick="renderVirtualUrl()">Open in Preview</button>
    </div>

    <p class="status-message" id="statusMessage" role="alert" aria-live="polite"></p>

    <!-- ─── SAVED / RECOMMENDED LINKS SECTION ─── -->
    <section class="saved-links-section" aria-label="Saved Links">
      <div class="saved-links-header">
        <h2 class="saved-links-title">
          <span>Saved Links</span>
        </h2>
        <span class="saved-links-count" id="savedLinksCount">0 / 6 saved</span>
      </div>

      <div class="saved-links-form">
        <div class="saved-form-inputs">
          <input
            type="text"
            id="savedLinkTitle"
            class="saved-input"
            placeholder="Link title (e.g. YouTube)"
            maxlength="50"
            onkeydown="if (event.key === 'Enter') handleSaveLink()"
          />
          <input
            type="url"
            id="savedLinkUrl"
            class="saved-input"
            placeholder="Paste link here (e.g. https://...)"
            onkeydown="if (event.key === 'Enter') handleSaveLink()"
          />
        </div>
        <div class="saved-form-bottom">
          <span class="saved-status-msg" id="savedStatusMsg" role="alert" aria-live="polite"></span>
          <button class="saved-save-btn" id="saveLinkBtn" type="button" onclick="handleSaveLink()">+ Save Link</button>
        </div>
      </div>

      <div class="saved-links-list" id="savedLinksList"></div>
    </section>

    <!-- ─── LAPTOP HARDWARE PREVIEW ─── -->
    <section class="laptop-hardware" id="laptopRig" aria-label="Website preview">
      <div class="laptop-screen-frame">
        <div class="laptop-display-content">
          <iframe
            src="about:blank"
            title="Website preview"
            class="virtual-iframe"
            id="monitorIframe"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          ></iframe>

          <div class="loader-screen-overlay" id="loaderModule" aria-hidden="true">
            <div class="loading-spinner" aria-label="Loading website"></div>
          </div>

          <div class="error-screen-overlay" id="errorModule" aria-hidden="true">
            <div class="error-card">
              <div class="error-title">Preview unavailable</div>
              <p class="error-copy">This site may block embedded previews. You can still open it in a regular tab.</p>
              <button class="error-action-btn" id="errorFallbackBtn" type="button">Open Tab</button>
              <button class="error-action-btn retry-btn" id="errorRetryBtn" type="button" onclick="retryPreview()">Retry Preview</button>
            </div>
          </div>
        </div>
      </div>
      <div class="laptop-base-chassis"></div>
      <p class="preview-fallback">Preview blank? <a id="previewFallbackLink" target="_blank" rel="noopener noreferrer">Open this site in a new tab</a>.</p>
    </section>
  </main>

  <script>
    const SECRET_MOVIE_URL = 'https://zstream.mov/';
    let loadTimer = null;
    let fallbackGlobalUrl = '';
    let previewRequestId = 0;
    let stopPreviewFallbackTimer = null;

    // Saved links configuration
    const SAVED_LINKS_KEY = 'tabs_saved_links';
    const MAX_SAVED_LINKS = 6;

    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('searchInput');
      const frame = document.getElementById('monitorIframe');

      input.focus();
      frame.addEventListener('load', handlePreviewLoad);
      renderSavedLinks();
    });

    function getValidUrl(rawInput) {
      if (typeof rawInput !== 'string') return null;
      const value = rawInput.trim();
      if (!value || /^(?!https?:)[a-z][a-z\d+.-]*:/i.test(value) && !/^[^/\s:]+:\d+(?:\/|$)/.test(value)) return null;

      try {
        const withProtocol = /^[a-zA-Z][a-zA-Z\d+.-]*:\/\//.test(value)
          ? value
          : 'https://' + value;
        const url = new URL(withProtocol);

        if (!window.siteHttpUrl(url.href)) return null;
        return url.href;
      } catch (error) {
        return null;
      }
    }

    function getInputUrl() {
      const input = document.getElementById('searchInput');
      const url = getValidUrl(input.value);

      if (!url) {
        showStatus('Please enter a valid website address.');
        input.focus();
        return null;
      }

      showStatus('');
      return url;
    }

    function renderVirtualUrl() {
      const verifiedUrl = getInputUrl();
      if (!verifiedUrl) return;

      const laptopRig = document.getElementById('laptopRig');
      const loaderLayer = document.getElementById('loaderModule');
      const errorLayer = document.getElementById('errorModule');
      const frame = document.getElementById('monitorIframe');

      fallbackGlobalUrl = verifiedUrl;
      const fallbackLink = document.getElementById("previewFallbackLink");
      if (stopPreviewFallbackTimer) stopPreviewFallbackTimer();
      fallbackLink.href = verifiedUrl;
      fallbackLink.parentElement.style.display = '';
      stopPreviewFallbackTimer = startDirectLinkCountdown(fallbackLink, fallbackLink.parentElement);
      previewRequestId += 1;
      frame.dataset.requestId = String(previewRequestId);
      frame.dataset.loaded = 'false';

      laptopRig.classList.add('visible');
      errorLayer.style.display = 'none';
      errorLayer.setAttribute('aria-hidden', 'true');
      loaderLayer.style.display = 'flex';
      loaderLayer.setAttribute('aria-hidden', 'false');
      showStatus('Loading preview…');

      frame.src = verifiedUrl;

      if (loadTimer) clearTimeout(loadTimer);
      const activeRequestId = previewRequestId;
      loadTimer = setTimeout(() => {
        if (
          activeRequestId === previewRequestId &&
          frame.dataset.loaded !== 'true'
        ) {
          triggerErrorPanel();
        }
      }, 12000);
    }

    function openInputNormally() {
      const verifiedUrl = getInputUrl();
      if (!verifiedUrl) return;

      const newWindow = window.open(verifiedUrl, '_blank');
      if (!newWindow) {
        showStatus('Your browser blocked the new tab. Please allow pop-ups for this site.');
        return;
      }

      try {
        newWindow.opener = null;
      } catch (error) {
        // The tab is already open; some browsers block access after navigation.
      }
    }

    function handlePreviewLoad() {
      const frame = document.getElementById('monitorIframe');

      if (!frame.dataset.requestId) return;
      frame.dataset.loaded = 'true';

      if (loadTimer) {
        clearTimeout(loadTimer);
        loadTimer = null;
      }

      hideLoader();
      document.getElementById('errorModule').style.display = 'none';
      document.getElementById('errorModule').setAttribute('aria-hidden', 'true');
      showStatus('Preview loaded. If it appears blank, open the site in a new tab.');
    }

    function hideLoader() {
      const loaderLayer = document.getElementById('loaderModule');
      loaderLayer.style.display = 'none';
      loaderLayer.setAttribute('aria-hidden', 'true');
    }

    function triggerErrorPanel() {
      hideLoader();
      showStatus('Preview timed out. Retry or open the site in a new tab.');
      const errorLayer = document.getElementById('errorModule');
      errorLayer.style.display = 'flex';
      errorLayer.setAttribute('aria-hidden', 'false');

      document.getElementById('errorFallbackBtn').onclick = () => {
        window.open(fallbackGlobalUrl, '_blank', 'noopener,noreferrer');
      };
    }

    function retryPreview() {
      if (!fallbackGlobalUrl) return;
      document.getElementById('searchInput').value = fallbackGlobalUrl;
      renderVirtualUrl();
    }

    function openInputInAboutBlank() {
      const verifiedUrl = getInputUrl();
      if (verifiedUrl) openInAboutBlank(verifiedUrl);
    }

    function openSecretMovieLink() {
      openInAboutBlank(SECRET_MOVIE_URL);
    }

    function openInAboutBlank(url) {
      const blankWindow = window.open('about:blank', '_blank');

      if (!blankWindow) {
        showStatus('Your browser blocked the new tab. Please allow pop-ups for this site.');
        return;
      }

      try {
        const blankDocument = blankWindow.document;
        blankDocument.title = 'Workspace';
        blankDocument.documentElement.style.width = '100%';
        blankDocument.documentElement.style.height = '100%';
        blankDocument.body.style.width = '100%';
        blankDocument.body.style.height = '100%';
        blankDocument.body.style.margin = '0';
        blankDocument.body.style.overflow = 'hidden';
        blankDocument.body.style.background = '#111';

        const directLink = blankDocument.createElement('a');
        directLink.href = url;
        directLink.textContent = 'Open directly if the preview is blank';
        directLink.style.cssText = 'height:40px;display:flex;align-items:center;justify-content:center;background:#15151f;color:#9fd7ff;font:14px Arial,sans-serif;text-decoration:none';
        blankDocument.body.appendChild(directLink);

        const siteFrame = blankDocument.createElement('iframe');
        siteFrame.src = url;
        siteFrame.title = 'Opened website';
        siteFrame.allow = 'fullscreen';
        siteFrame.referrerPolicy = 'no-referrer';
        siteFrame.style.width = '100%';
        siteFrame.style.height = 'calc(100% - 40px)';
        siteFrame.style.border = '0';
        siteFrame.style.display = 'block';
        blankDocument.body.appendChild(siteFrame);
        startDirectLinkCountdown(directLink, directLink, siteFrame, 7);
      } catch (error) {
        blankWindow.location.replace(url);
      }
    }

    function showStatus(message) {
      document.getElementById('statusMessage').textContent = message;
    }

    // ─── SAVED / RECOMMENDED LINKS LOGIC ───
    function getSavedLinks() {
      try {
        const raw = siteStorage.getItem(SAVED_LINKS_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          return parsed.filter(item => item && typeof item.url === 'string' && item.url.trim());
        }
      } catch (e) {
        console.warn('Failed to parse saved links:', e);
      }
      return [];
    }

    function saveLinksToStorage(links) {
      try {
        siteStorage.setItem(SAVED_LINKS_KEY, JSON.stringify(links.slice(0, MAX_SAVED_LINKS)));
      } catch (e) {
        console.warn('Failed to save links:', e);
      }
      renderSavedLinks();
    }

    function deriveFriendlyTitle(urlStr) {
      try {
        const u = new URL(urlStr);
        let host = u.hostname.replace(/^www\./, '');
        const parts = host.split('.');
        if (parts.length > 1) {
          const mainPart = parts[0];
          return mainPart.charAt(0).toUpperCase() + mainPart.slice(1);
        }
        return host;
      } catch {
        return 'Link';
      }
    }

    function handleSaveLink() {
      const titleInput = document.getElementById('savedLinkTitle');
      const urlInput = document.getElementById('savedLinkUrl');
      const statusEl = document.getElementById('savedStatusMsg');

      const currentLinks = getSavedLinks();
      if (currentLinks.length >= MAX_SAVED_LINKS) {
        statusEl.textContent = 'Maximum 6 saved links reached. Delete one first.';
        return;
      }

      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        statusEl.textContent = 'Please enter or paste a valid link.';
        urlInput.focus();
        return;
      }

      const validUrl = getValidUrl(rawUrl);
      if (!validUrl) {
        statusEl.textContent = 'Invalid link format. Use an http or https address.';
        urlInput.focus();
        return;
      }

      let title = titleInput.value.trim();
      if (!title) {
        title = deriveFriendlyTitle(validUrl);
      }

      const newEntry = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title: title.slice(0, 50),
        url: validUrl
      };

      currentLinks.unshift(newEntry);
      saveLinksToStorage(currentLinks);

      titleInput.value = '';
      urlInput.value = '';
      statusEl.textContent = '';
      titleInput.focus();
    }

    function removeSavedLink(id) {
      const current = getSavedLinks();
      const updated = current.filter(item => item.id !== id);
      saveLinksToStorage(updated);
      document.getElementById('savedStatusMsg').textContent = '';
    }

    async function copySavedLink(url, btnElement) {
      let copiedOk = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(url);
          copiedOk = true;
        } catch {}
      }

      if (!copiedOk) {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          copiedOk = document.execCommand('copy');
        } catch {}
        document.body.removeChild(ta);
      }

      const originalHtml = btnElement.innerHTML;
      btnElement.classList.add('copied');
      btnElement.innerHTML = '✓ Copied';
      setTimeout(() => {
        btnElement.classList.remove('copied');
        btnElement.innerHTML = originalHtml;
      }, 1500);
    }

    function openSavedLink(url) {
      document.getElementById('searchInput').value = url;
      openInAboutBlank(url);
    }

    function renderSavedLinks() {
      const listEl = document.getElementById('savedLinksList');
      const countEl = document.getElementById('savedLinksCount');
      const saveBtn = document.getElementById('saveLinkBtn');
      const statusEl = document.getElementById('savedStatusMsg');

      const links = getSavedLinks();
      countEl.textContent = `${links.length} / ${MAX_SAVED_LINKS} saved`;

      if (links.length >= MAX_SAVED_LINKS) {
        saveBtn.disabled = true;
      } else {
        saveBtn.disabled = false;
        if (statusEl.textContent.includes('Maximum 6')) {
          statusEl.textContent = '';
        }
      }

      listEl.innerHTML = '';

      if (links.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'saved-empty-hint';
        empty.textContent = 'No saved links yet. Paste a link above to keep up to 6 quick links here.';
        listEl.appendChild(empty);
        return;
      }

      links.forEach(item => {
        const row = document.createElement('div');
        row.className = 'saved-link-row';

        // Main clickable link card
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'saved-link-card';
        card.title = `Open ${item.title} (${item.url})`;
        card.onclick = () => openSavedLink(item.url);

        const titleEl = document.createElement('strong');
        titleEl.textContent = item.title;

        const urlEl = document.createElement('small');
        urlEl.textContent = item.url;

        card.appendChild(titleEl);
        card.appendChild(urlEl);

        // Copy button
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'saved-link-action-btn saved-copy-btn';
        copyBtn.title = 'Copy link URL';
        copyBtn.setAttribute('aria-label', `Copy link URL for ${item.title}`);
        copyBtn.innerHTML = '📋 Copy';
        copyBtn.onclick = (e) => {
          e.stopPropagation();
          copySavedLink(item.url, copyBtn);
        };

        // Delete button
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'saved-link-action-btn saved-delete-btn';
        delBtn.title = 'Delete link';
        delBtn.setAttribute('aria-label', `Delete ${item.title}`);
        delBtn.innerHTML = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          removeSavedLink(item.id);
        };

        row.appendChild(card);
        row.appendChild(copyBtn);
        row.appendChild(delBtn);

        listEl.appendChild(row);
      });
    }

    // Sync across tabs
    window.addEventListener('storage', (e) => {
      if (e.key === null || e.key === SAVED_LINKS_KEY) {
        renderSavedLinks();
      }
    });

  </script>
</body>
</html>
