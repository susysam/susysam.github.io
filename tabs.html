<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Screen</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Google_Classroom_Logo.svg/2372px-Google_Classroom_Logo.svg.png" type="image/png" />

  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>

  <style>
    :root {
      --bg: #f4f7fc;
      --text: #14161a;
      --muted: rgba(20, 22, 26, .65);
      --border: rgba(0, 0, 0, .14);
      --card: rgba(255, 255, 255, .82);
      --overlay: rgba(255, 255, 255, 0);
      --accent: #6c0ba9;
      --accent-hover: #4f0672;
      --normal: #2563eb;
      --normal-hover: #1d4ed8;
      --blank: #059669;
      --blank-hover: #047857;
      --secret: #d97706;
      --secret-hover: #b45309;
      --preview: #7c3aed;
      --preview-hover: #6d28d9;
      --danger: #ff5733;
      --laptop-shell: #dcdde1;
      --laptop-bezel: #1e272e;
    }

    :root.dark {
      --bg: #0f1116;
      --text: #f2f4f8;
      --muted: rgba(242, 244, 248, .68);
      --border: rgba(255, 255, 255, .14);
      --card: rgba(25, 28, 36, .72);
      --overlay: rgba(0, 0, 0, .45);
      --laptop-shell: #2f3640;
      --laptop-bezel: #0f1418;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: background-color .25s ease, color .25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--overlay);
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(20px);
      animation: ui-reveal .65s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    @keyframes ui-reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .home-button,
    .action-button,
    .error-action-btn {
      border: 0;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .2s ease, transform .1s ease;
    }

    .home-button {
      margin-bottom: 20px;
      padding: 10px 22px;
      border-radius: 10px;
      background: var(--accent);
      font-size: 15px;
    }

    .home-button:hover {
      background: var(--accent-hover);
    }

    .home-button:active,
    .action-button:active,
    .error-action-btn:active {
      transform: translateY(1px);
    }

    .search-bar {
      width: 100%;
      max-width: 550px;
      margin-bottom: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      transition: border-color .2s ease;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .action-buttons {
      width: 100%;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .action-button {
      min-height: 42px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
    }

    .action-button.normal {
      background: var(--normal);
    }

    .action-button.normal:hover {
      background: var(--normal-hover);
    }

    .action-button.blank {
      background: var(--blank);
    }

    .action-button.blank:hover {
      background: var(--blank-hover);
    }

    .action-button.secret {
      background: var(--secret);
    }

    .action-button.secret:hover {
      background: var(--secret-hover);
    }

    .action-button.preview {
      min-height: 36px;
      align-self: center;
      padding: 8px 14px;
      background: var(--preview);
      font-size: 13px;
    }

    .action-button.preview:hover {
      background: var(--preview-hover);
    }

    .status-message {
      min-height: 20px;
      margin: -13px 0 18px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .laptop-hardware {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(.96);
      transition: opacity .4s ease, transform .4s ease;
    }

    .laptop-hardware.visible {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .laptop-screen-frame {
      width: 100%;
      aspect-ratio: 16 / 10;
      padding: 20px 20px 24px;
      position: relative;
      border-radius: 16px 16px 0 0;
      background: var(--laptop-bezel);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
    }

    .laptop-display-content {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      border-radius: 4px;
      background: #111;
    }

    .virtual-iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #fff;
    }

    .loader-screen-overlay,
    .error-screen-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .loader-screen-overlay {
      z-index: 5;
      background: #141519;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, .1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-screen-overlay {
      z-index: 10;
      flex-direction: column;
      padding: 20px;
      background: #1e222b;
      color: #fff;
      text-align: center;
    }

    .error-card {
      max-width: 420px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
    }

    .error-title {
      margin-bottom: 10px;
      color: #ff6b6b;
      font-size: 20px;
      font-weight: 700;
    }

    .error-copy {
      margin-bottom: 16px;
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      line-height: 1.45;
    }

    .error-action-btn {
      padding: 10px 20px;
      border-radius: 6px;
      background: #ff5252;
      font-size: 14px;
    }

    .error-action-btn:hover {
      background: #ff3333;
    }

    .laptop-base-chassis {
      width: 104%;
      height: 14px;
      position: relative;
      border-top: 2px solid rgba(255, 255, 255, .2);
      border-radius: 0 0 16px 16px;
      background: var(--laptop-shell);
      box-shadow: 0 12px 25px rgba(0, 0, 0, .2);
    }

    .laptop-base-chassis::before {
      content: "";
      width: 70px;
      height: 4px;
      position: absolute;
      top: 0;
      left: 50%;
      border-radius: 0 0 4px 4px;
      background: rgba(0, 0, 0, .15);
      transform: translateX(-50%);
    }

    @media (max-width: 650px) {
      .action-buttons {
        flex-direction: column;
      }

      .action-button {
        width: 100%;
      }

      .laptop-screen-frame {
        padding: 10px 10px 14px;
        border-radius: 10px 10px 0 0;
      }
    }
  </style>
</head>
<body>
  <main class="app-container">
    <button class="home-button" type="button" onclick="goHome()">Home</button>

    <label for="searchInput" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Website URL</label>
    <input
      type="url"
      id="searchInput"
      class="search-bar"
      placeholder="Enter web URL (e.g., example.com)"
      autocomplete="url"
      onkeydown="if (event.key === 'Enter') openInputNormally()"
    />

    <div class="action-buttons" aria-label="Site opening options">
      <button class="action-button normal" type="button" onclick="openInputNormally()">Open Site (Normally)</button>
      <button class="action-button blank" type="button" onclick="openInputInAboutBlank()">Open Site (About:Blank)</button>
      <button class="action-button secret" type="button" onclick="openSecretMovieLink()">Secret Movie Link</button>
      <button class="action-button preview" type="button" onclick="renderVirtualUrl()">Open in Preview</button>
    </div>

    <p class="status-message" id="statusMessage" role="alert" aria-live="polite"></p>

    <section class="laptop-hardware" id="laptopRig" aria-label="Website preview">
      <div class="laptop-screen-frame">
        <div class="laptop-display-content">
          <iframe
            src="about:blank"
            title="Website preview"
            class="virtual-iframe"
            id="monitorIframe"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
          ></iframe>

          <div class="loader-screen-overlay" id="loaderModule" aria-hidden="true">
            <div class="loading-spinner" aria-label="Loading website"></div>
          </div>

          <div class="error-screen-overlay" id="errorModule" aria-hidden="true">
            <div class="error-card">
              <div class="error-title">Preview unavailable</div>
              <p class="error-copy">This site may block embedded previews. You can still open it in a regular tab.</p>
              <button class="error-action-btn" id="errorFallbackBtn" type="button">Open Tab</button>
            </div>
          </div>
        </div>
      </div>
      <div class="laptop-base-chassis"></div>
    </section>
  </main>

  <script>
    const SECRET_MOVIE_URL = 'https://example.com/';
    let loadTimer = null;
    let fallbackGlobalUrl = '';
    let previewRequestId = 0;

    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('searchInput');
      const frame = document.getElementById('monitorIframe');

      input.focus();
      frame.addEventListener('load', handlePreviewLoad);
    });

    function getValidUrl(rawInput) {
      const value = rawInput.trim();
      if (!value) return null;

      try {
        const withProtocol = /^[a-zA-Z][a-zA-Z\d+.-]*:\/\//.test(value)
          ? value
          : 'https://' + value;
        const url = new URL(withProtocol);

        if (url.protocol !== 'http:' && url.protocol !== 'https:') return null;
        return url.href;
      } catch (error) {
        return null;
      }
    }

    function getInputUrl() {
      const input = document.getElementById('searchInput');
      const url = getValidUrl(input.value);

      if (!url) {
        showStatus('Please enter a valid website address.');
        input.focus();
        return null;
      }

      showStatus('');
      return url;
    }

    function renderVirtualUrl() {
      const verifiedUrl = getInputUrl();
      if (!verifiedUrl) return;

      const laptopRig = document.getElementById('laptopRig');
      const loaderLayer = document.getElementById('loaderModule');
      const errorLayer = document.getElementById('errorModule');
      const frame = document.getElementById('monitorIframe');

      fallbackGlobalUrl = verifiedUrl;
      previewRequestId += 1;
      frame.dataset.requestId = String(previewRequestId);
      frame.dataset.loaded = 'false';

      laptopRig.classList.add('visible');
      errorLayer.style.display = 'none';
      errorLayer.setAttribute('aria-hidden', 'true');
      loaderLayer.style.display = 'flex';
      loaderLayer.setAttribute('aria-hidden', 'false');

      frame.src = verifiedUrl;

      if (loadTimer) clearTimeout(loadTimer);
      const activeRequestId = previewRequestId;
      loadTimer = setTimeout(() => {
        if (
          activeRequestId === previewRequestId &&
          frame.dataset.loaded !== 'true'
        ) {
          triggerErrorPanel();
        }
      }, 12000);
    }

    function openInputNormally() {
      const verifiedUrl = getInputUrl();
      if (!verifiedUrl) return;

      const newWindow = window.open(verifiedUrl, '_blank');
      if (!newWindow) {
        showStatus('Your browser blocked the new tab. Please allow pop-ups for this site.');
        return;
      }

      newWindow.opener = null;
    }

    function handlePreviewLoad() {
      const frame = document.getElementById('monitorIframe');

      if (!frame.dataset.requestId) return;
      frame.dataset.loaded = 'true';

      if (loadTimer) {
        clearTimeout(loadTimer);
        loadTimer = null;
      }

      hideLoader();
    }

    function hideLoader() {
      const loaderLayer = document.getElementById('loaderModule');
      loaderLayer.style.display = 'none';
      loaderLayer.setAttribute('aria-hidden', 'true');
    }

    function triggerErrorPanel() {
      hideLoader();
      const errorLayer = document.getElementById('errorModule');
      errorLayer.style.display = 'flex';
      errorLayer.setAttribute('aria-hidden', 'false');

      document.getElementById('errorFallbackBtn').onclick = () => {
        window.open(fallbackGlobalUrl, '_blank', 'noopener,noreferrer');
      };
    }

    function openInputInAboutBlank() {
      const verifiedUrl = getInputUrl();
      if (verifiedUrl) openInAboutBlank(verifiedUrl);
    }

    function openSecretMovieLink() {
      openInAboutBlank(SECRET_MOVIE_URL);
    }

    function openInAboutBlank(url) {
      const blankWindow = window.open('about:blank', '_blank');

      if (!blankWindow) {
        showStatus('Your browser blocked the new tab. Please allow pop-ups for this site.');
        return;
      }

      try {
        blankWindow.document.open();
        blankWindow.document.write(`<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Loading...</title>
              <style>
                html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
                body { background: #111; }
              </style>
            </head>
            <body>
              <iframe src="${escapeHtmlAttribute(url)}" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
            </body>
          </html>`);
        blankWindow.document.close();
      } catch (error) {
        blankWindow.location.replace(url);
      }
    }

    function escapeHtmlAttribute(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function showStatus(message) {
      document.getElementById('statusMessage').textContent = message;
    }

    function goHome() {
      window.location.href = 'https://susysam.github.io/start27.html';
    }
  </script>

  <script src="site-settings.js"></script>
</body>
</html>
