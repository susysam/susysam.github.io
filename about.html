<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Home</title>
  <script src="/site-storage.js"></script>
  <style>
    :root { --bg:#f6f7fb; --text:#14161a; --card:#fff; --muted:#555; }
    :root.dark { --bg:#0f1116; --text:#f2f4f8; --card:#191c24; --muted:#bbc0cb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; display:grid; place-items:center; font-family:Arial,sans-serif; background:var(--bg); color:var(--text); text-align:center; }
    main { padding:28px; width:min(100%,440px); background:var(--card); border-radius:16px; }
    h1 { font-size:24px; }
    p { color:var(--muted); line-height:1.5; }
    button { padding:14px 24px; border:0; border-radius:10px; background:#6c0ba9; color:white; font-size:16px; cursor:pointer; }
    a { color:var(--text); }
  </style>
  <script src="/site-appearance.js"></script>
</head>
<body>
  <main>
    <h1>Open Home in about:blank</h1>
    <p>Use the button to open the site in a new blank tab.</p>
    <button type="button" id="openHome">Open Home</button>
    <p id="launchStatus" role="status"></p>
    <a href="/start27.html">Go directly to Home</a>
  </main>
  <script>
    function Go() {
      const popup = window.open('about:blank', '_blank');
      if (!popup) {
        document.getElementById('launchStatus').textContent = 'Popup blocked. Allow popups or use the Home link below.';
        return;
      }
      popup.document.title = 'Home';
      popup.document.documentElement.style.height = '100%';
      popup.document.body.style.cssText = 'margin:0;height:100%;background:#0f1116';
      const frame = popup.document.createElement('iframe');
      frame.title = 'Home';
      frame.src = new URL('/start27.html', location.href).href;
      frame.style.cssText = 'display:block;width:100%;height:100%;border:0';
      popup.document.body.appendChild(frame);
      document.getElementById('launchStatus').textContent = 'Home opened in a new tab.';
    }
    document.getElementById('openHome').addEventListener('click', Go);
  </script>
</body>
</html>
