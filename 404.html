<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Page Not Found</title>

  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>

  <style>
    :root {
      --bg: #f2f2f2;
      --text: #14161a;
      --card: rgba(255, 255, 255, .92);
      --border: rgba(0, 0, 0, .10);
      --shadow: 0 18px 45px rgba(0, 0, 0, .12);
      --accent: #6c0ba9;
      --accent-hover: #4f0672;
      --danger: #ff6347;
      --muted: rgba(20, 22, 26, .65);
      --overlay: rgba(255, 255, 255, 0);
    }

    :root.dark {
      --bg: #0f1116;
      --text: #f2f4f8;
      --card: rgba(25, 28, 36, .75);
      --border: rgba(255, 255, 255, .12);
      --shadow: 0 18px 55px rgba(0, 0, 0, .55);
      --muted: rgba(242, 244, 248, .70);
      --overlay: rgba(0, 0, 0, .45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color .25s ease, color .25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--overlay);
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background-color: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform .3s ease;
    }

    .container:hover {
      transform: translateY(-4px);
    }

    h1 {
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 32px;
      font-weight: 800;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .home-btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 50px;
      background-color: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .2s ease, transform .2s ease;
    }

    .home-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.03);
    }

    .home-btn:active {
      transform: scale(.98);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>404</h1>
    <p>The page you're looking for does not exist or has been relocated.</p>
    <a href="https://susysam.github.io/start27.html" class="home-btn">Return Home</a>
  </main>
</body>
</html>
